<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900" role="img" aria-labelledby="title desc"><title id="title">Korean Spicy Ground Beef Rice Bowl recipe card</title><desc id="desc">Printable recipe card showing ingredients, method, cook time, yield and heat level.</desc>
<rect width="1200" height="1900" fill="#f7f4ef"/>
<rect width="1200" height="270" fill="#b85d38"/>
<circle cx="1070" cy="95" r="145" fill="#d98156" opacity=".35"/>
<circle cx="1140" cy="245" r="100" fill="#e49c72" opacity=".25"/>
<text x="86" y="73" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fae4d3" letter-spacing="5">YANN.CA  /  MY COOKBOOK</text>
<text x="86" y="151" font-family="Arial,sans-serif" font-size="59" font-weight="700" fill="#fffefa">KOREAN SPICY</text>
<text x="86" y="220" font-family="Arial,sans-serif" font-size="59" font-weight="700" fill="#fffefa">GROUND BEEF BOWL</text>
<rect x="64" y="290" width="1072" height="78" rx="20" fill="#eee5d9"/>
<text x="92" y="340" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#70584b">30 MIN TOTAL</text>
<text x="406" y="340" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#70584b">SERVES 2–3</text>
<text x="727" y="340" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#98512f">MEDIUM SPICE</text>
<rect x="64" y="390" width="500" height="1080" rx="22" fill="#fffefd"/>
<rect x="590" y="390" width="546" height="1080" rx="22" fill="#fffefd"/>
<text x="94" y="440" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#98512f" letter-spacing="3">INGREDIENTS</text>
<line x1="94" y1="462" x2="534" y2="462" stroke="#eaded3" stroke-width="2"/>
<g transform="translate(0,118)"><text x="94" y="385" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">500 g</tspan><tspan dx="10">ground beef</tspan></text><text x="94" y="432" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tbsp</tspan><tspan dx="10">cooking oil</tspan></text><text x="94" y="479" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">3 cloves</tspan><tspan dx="10">garlic, minced</tspan></text><text x="94" y="526" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tsp</tspan><tspan dx="10">fresh grated ginger</tspan></text><text x="94" y="573" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">2 tbsp</tspan><tspan dx="10">soy sauce</tspan></text><text x="94" y="620" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tbsp</tspan><tspan dx="10">brown sugar</tspan></text><text x="94" y="667" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tbsp</tspan><tspan dx="10">gochujang</tspan></text><text x="94" y="714" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tsp</tspan><tspan dx="10">sesame oil</tspan></text><text x="94" y="761" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tsp</tspan><tspan dx="10">rice vinegar</tspan></text><text x="94" y="808" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">2 tbsp</tspan><tspan dx="10">water</tspan></text><text x="94" y="855" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">2 cups</tspan><tspan dx="10">cooked white rice</tspan></text><text x="94" y="902" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1</tspan><tspan dx="10">cucumber, sliced</tspan></text><text x="94" y="949" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1</tspan><tspan dx="10">carrot, shredded</tspan></text><text x="94" y="996" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">2</tspan><tspan dx="10">green onions, sliced</tspan></text><text x="94" y="1043" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">1 tbsp</tspan><tspan dx="10">sesame seeds</tspan></text><text x="94" y="1090" font-family="Arial,sans-serif" font-size="27" fill="#352a25"><tspan font-weight="700" fill="#98512f">2</tspan><tspan dx="10">eggs (optional)</tspan></text></g>
<text x="630" y="440" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#98512f" letter-spacing="3">METHOD</text>
<line x1="630" y1="462" x2="1096" y2="462" stroke="#eaded3" stroke-width="2"/>
<g transform="translate(0,110)"><circle cx="665" cy="395" r="21" fill="#b85d38"/><text x="665" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="white">1</text><text x="707" y="404" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#8f4328">MAKE THE SAUCE</text><text x="707" y="446" font-family="Arial,sans-serif" font-size="22" fill="#43352c">Stir soy sauce, brown sugar, gochujang,</text><text x="707" y="481" font-family="Arial,sans-serif" font-size="22" fill="#43352c">sesame oil, rice vinegar and water.</text><circle cx="665" cy="596" r="21" fill="#b85d38"/><text x="665" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="white">2</text><text x="707" y="605" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#8f4328">BROWN THE BEEF</text><text x="707" y="647" font-family="Arial,sans-serif" font-size="22" fill="#43352c">Heat oil in a skillet. Brown the beef,</text><text x="707" y="682" font-family="Arial,sans-serif" font-size="22" fill="#43352c">breaking it up, 6–8 minutes.</text><circle cx="665" cy="797" r="21" fill="#b85d38"/><text x="665" y="806" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="white">3</text><text x="707" y="806" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#8f4328">ADD AROMATICS</text><text x="707" y="848" font-family="Arial,sans-serif" font-size="22" fill="#43352c">Stir in garlic and ginger. Cook for</text><text x="707" y="883" font-family="Arial,sans-serif" font-size="22" fill="#43352c">30–60 seconds until fragrant.</text><circle cx="665" cy="998" r="21" fill="#b85d38"/><text x="665" y="1007" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="white">4</text><text x="707" y="1007" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#8f4328">SIMMER IN SAUCE</text><text x="707" y="1049" font-family="Arial,sans-serif" font-size="22" fill="#43352c">Pour sauce into the pan. Simmer for</text><text x="707" y="1084" font-family="Arial,sans-serif" font-size="22" fill="#43352c">2–4 minutes until glossy and coated.</text><circle cx="665" cy="1199" r="21" fill="#b85d38"/><text x="665" y="1208" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="white">5</text><text x="707" y="1208" font-family="Arial,sans-serif" font-weight="700" font-size="25" fill="#8f4328">BUILD YOUR BOWL</text><text x="707" y="1250" font-family="Arial,sans-serif" font-size="22" fill="#43352c">Divide rice between bowls. Top with</text><text x="707" y="1285" font-family="Arial,sans-serif" font-size="22" fill="#43352c">beef, cucumber, carrot, scallions,</text><text x="707" y="1320" font-family="Arial,sans-serif" font-size="22" fill="#43352c">sesame seeds and optional eggs.</text></g>
<rect x="64" y="1510" width="1072" height="186" rx="22" fill="#e8ecdf"/>
<text x="94" y="1560" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#53634b">MAKE IT YOURS</text>
<text x="94" y="1606" font-family="Arial,sans-serif" font-size="26" fill="#3a4337">Gochujang: mild ½ tbsp  ·  medium 1 tbsp  ·  hot 2 tbsp.</text>
<text x="94" y="1649" font-family="Arial,sans-serif" font-size="26" fill="#3a4337">Try a fried egg, kimchi or a little Kewpie mayo.</text>
<text x="86" y="1800" font-family="Arial,sans-serif" font-size="25" fill="#7f746a">Korean-inspired, bulgogi-style ground beef rice bowl</text>
<text x="1114" y="1800" text-anchor="end" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#b85d38">yann.ca/recipes</text>
</svg>