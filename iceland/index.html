const formatActivities = (activities = {}) => {
  const entries = activityOrder
    .filter((key) => activities[key] && activities[key].length)
    .map((key) => [key, activities[key]]);

  if (!entries.length) {
    return "<div class='activity-group'><div class='activity-title'>Activities</div><div>TBD</div></div>";

  return entries
    .map(([key, items]) => {
      const label = activityLabels[key] || key;
      const list = items.map((item) => `<li>${item}</li>`).join('');

const ICELAND_MAP_STATE_KEY = 'yann-iceland-map-state-v1';

const setCookie = (name, value, days = 365) => {
  const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
};

const getCookie = (name) => {
  const prefix = `${name}=`;
  const parts = document.cookie.split(';').map((c) => c.trim());
  for (const part of parts) {
    if (part.startsWith(prefix)) {
      return decodeURIComponent(part.slice(prefix.length));
    }
  }
  return null;
};

const loadMapState = () => {
  try {
    const fromLocal = localStorage.getItem(ICELAND_MAP_STATE_KEY);
    if (fromLocal) return JSON.parse(fromLocal);
  } catch (err) {}

  try {
    const fromCookie = getCookie(ICELAND_MAP_STATE_KEY);
    if (fromCookie) return JSON.parse(fromCookie);
  } catch (err) {}

  return null;
};

const saveMapState = (state) => {
  const serialized = JSON.stringify(state);
  try {
    localStorage.setItem(ICELAND_MAP_STATE_KEY, serialized);
  } catch (err) {}
  try {
    setCookie(ICELAND_MAP_STATE_KEY, serialized);
  } catch (err) {}
};


const captureOverlayState = () => {
  const visibleOvernights = Object.keys(overnightMarkersByNight)
    .map((night) => Number(night))
    .filter((night) => isOvernightVisible(night));

  const visibleRouteLegs = Object.entries(routeLegLayers)
    .filter(([, layer]) => map.hasLayer(layer))
    .map(([legId]) => legId);

  const visibleMarkers = Object.keys(activityMarkerLookup).filter((markerId) =>
    isActivityVisible(markerId)
  );

  const visibleGroups = Object.keys(overlayConfig).reduce((acc, key) => {
    acc[key] = Boolean(overlayConfig[key] && overlayConfig[key].visible);
    return acc;
  }, {});

  return { visibleGroups, visibleOvernights, visibleRouteLegs, visibleMarkers };
};

const captureLegendState = () => {
  if (!legendContainer) {
    return { collapsedSections: [] };
  }
  const sections = Array.from(legendContainer.querySelectorAll('.legend-section[data-section]'));
  const collapsedSections = sections
    .filter((section) => section.classList.contains('collapsed'))
    .map((section) => section.getAttribute('data-section'))
    .filter(Boolean);
  return { collapsedSections };
};

const persistCurrentState = () => {
  const center = map.getCenter();
  const overlayState = captureOverlayState();
  const legendState = captureLegendState();
  saveMapState({
    center: [center.lat, center.lng],
    zoom: map.getZoom(),
    popupFontSize,
    ...overlayState,
    ...legendState
  });
};

const restoreOverlayState = (state) => {
  if (!state) {
    return;
  }

  // Group-level overlays (fallback; helps when marker IDs change across builds)
  if (state.visibleGroups && typeof state.visibleGroups === 'object') {
    Object.entries(state.visibleGroups).forEach(([key, visible]) => {
      if (overlayConfig[key]) {
        setGroupVisibility(key, Boolean(visible));
      }
    });
  }

  // Route legs
  if (Array.isArray(state.visibleRouteLegs)) {
    const matchCount = state.visibleRouteLegs.filter((legId) => routeLegLayers[legId]).length;
    if (matchCount === 0 && state.visibleRouteLegs.length > 0) {
      // Likely stale IDs from an older build; keep group-level visibility.
    } else {
      const visible = new Set(state.visibleRouteLegs);
    Object.entries(routeLegLayers).forEach(([legId, layer]) => {
      if (visible.has(legId)) {
        map.addLayer(layer);
      } else {
        map.removeLayer(layer);
      }
    });
    if (overlayConfig.route) {
      const total = Object.keys(routeLegLayers).length;
      overlayConfig.route.visible = total > 0 && state.visibleRouteLegs.length === total;
    }
  }
  }

  // Overnight stops
  if (Array.isArray(state.visibleOvernights)) {
    const total = Object.keys(overnightMarkersByNight).length;
    const matchCount = state.visibleOvernights.filter((n) => overnightMarkersByNight[Number(n)]).length;
    if (matchCount === 0 && state.visibleOvernights.length > 0 && total > 0) {
      // Likely stale IDs from an older build; keep group-level visibility.
    } else {
      const visible = new Set(state.visibleOvernights.map((n) => Number(n)));
    Object.keys(overnightMarkersByNight).forEach((night) => {
      setOvernightVisibility(Number(night), visible.has(Number(night)));
    });
    overlayConfig.overnight.visible = total > 0 && state.visibleOvernights.length === total;
  }
  }

  // Activity markers
  if (Array.isArray(state.visibleMarkers)) {
    const matchCount = state.visibleMarkers.filter((markerId) => activityMarkerLookup[markerId]).length;
    if (matchCount === 0 && state.visibleMarkers.length > 0) {
      // Likely stale IDs from an older build; keep group-level visibility.
    } else {
      const visible = new Set(state.visibleMarkers);
    Object.keys(activityMarkerLookup).forEach((markerId) => {
      setActivityVisibility(markerId, visible.has(markerId));
    });

    activityOrder.forEach((groupKey) => {
      const markerIds = activityMarkersByGroup[groupKey] || [];
      if (!markerIds.length) {
        return;
      }
      const visibleCount = markerIds.filter((markerId) => visible.has(markerId)).length;
      overlayConfig[groupKey].visible = visibleCount === markerIds.length;
    });
  }
  }
};

const restoreLegendState = (state) => {
  if (!legendContainer || !state) {
    return;
  }
  if (!Array.isArray(state.collapsedSections)) {
    return;
  }
  const collapsed = new Set(state.collapsedSections);
  legendContainer.querySelectorAll('.legend-section[data-section]').forEach((section) => {
    const key = section.getAttribute('data-section');
    if (!key) {
      return;
    }
    section.classList.toggle('collapsed', collapsed.has(key));
  });
};

};

const routeLegLayers = {};
routeSegments.forEach((segment) => {
  if (!segment.coordinates || !segment.coordinates.length) {
    return;
  }

  const blueRouteStyle = {
    color: '#1f6feb',
    weight: 3,
    opacity: 0.8
  };

  if (segment.id === '2-3') {
    // F225/F208 excursion to Landmannalaugar and back. Keep the paved portions blue.
    const fRoadStart = 697;
    const fRoadEnd = 4188;
    const pavedBefore = L.polyline(segment.coordinates.slice(0, fRoadStart + 1), blueRouteStyle);
    const fRoad = L.polyline(segment.coordinates.slice(fRoadStart, fRoadEnd + 1), {
      color: '#f97316',
      weight: 5,
      opacity: 0.95
    }).bindTooltip('F225 / F208 · F-road · 4×4 required');
    const pavedAfter = L.polyline(segment.coordinates.slice(fRoadEnd), blueRouteStyle);
    routeLegLayers[segment.id] = L.featureGroup([pavedBefore, fRoad, pavedAfter]);
    return;
  }

  routeLegLayers[segment.id] = L.polyline(segment.coordinates, blueRouteStyle);
});

routeSegments.forEach((segment) => {
  const layer = routeLegLayers[segment.id];
  if (!layer) return;
  const estimatedHours = Math.max(1, Math.round((segment.km / (segment.id === '2-3' ? 45 : 65)) * 2) / 2);
  const timeLabel = estimatedHours < 2 ? `${estimatedHours} hr` : `${estimatedHours} hrs`;
  const routeNote = segment.note ? `<div><strong>Plan:</strong> ${segment.note}</div>` : '';
  const fRoadNote = segment.id === '2-3'
    ? '<div style="color:#c2410c"><strong>F-road:</strong> F225/F208 requires a suitable 4×4; verify road and river conditions.</div>'
    : '';
  layer.bindPopup(`
    <div class='route-popup'>
      <strong>${segment.from} → ${segment.to}</strong>
      <div>${segment.km} km · about ${timeLabel} driving</div>
      ${routeNote}${fRoadNote}
      <div style="font-size:.8em;color:#6b7280">Planning estimate only; stops and conditions add time.</div>

});

          html: iconMarkup,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        }),
        keyboard: true,
        title: marker.name
      })
    : L.marker([marker.lat, marker.lon], {
        icon: L.divIcon({
          className: 'activity-marker-icon',
          html: `<span class='activity-marker-dot' style='--marker-color:${color}'></span>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        }),
        keyboard: true,
        title: marker.name
      });
  activityLayer.bindPopup(popup).addTo(group);
  activityLayer.on('click', () => {
    if (map.getZoom() >= 13) return;
    const here = map.latLngToContainerPoint(activityLayer.getLatLng());
    const nearby = Object.values(activityMarkerLookup).filter((entry) => {
      if (!entry.layer || entry.layer === activityLayer) return false;
      return here.distanceTo(map.latLngToContainerPoint(entry.layer.getLatLng())) < 34;
    });
    if (nearby.length) {
      map.setView(activityLayer.getLatLng(), Math.min(13, map.getZoom() + 2));
    }
  });
  activityMarkerLookup[markerId] = { layer: activityLayer, groupKey: marker.type };
  activityMarkerData[markerId] = marker;
  activityMarkersByGroup[marker.type].push(markerId);
});

const accessConnectors = L.featureGroup();
const connectorNames = new Set([
  'Hangandifoss Waterfall & Múlagljúfur Canyon',
  'Hjörleifshöfði & Gígjagjá (Yoda Cave)',
  'Gjáin valley',
  'Látrabjarg bird cliffs'
]);
const routePoints = routeSegments.flatMap((segment) => (segment.coordinates || []).filter((_, index) => index % 8 === 0));
activityMarkers.filter((marker) => connectorNames.has(marker.name)).forEach((marker) => {
  let nearest = null;
  let nearestDistance = Infinity;
  routePoints.forEach((point) => {
    const distance = Math.pow(point[0] - marker.lat, 2) + Math.pow(point[1] - marker.lon, 2);
    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearest = point;
    }
  });
  if (nearest) {
    L.polyline([nearest, [marker.lat, marker.lon]], {
      color: '#7c3aed',
      dashArray: '6 6',
      weight: 2,
      opacity: 0.8
    }).bindTooltip(`Approximate access to ${marker.name} · confirm navigation`).addTo(accessConnectors);
  }
});
accessConnectors.addTo(map);

const overlayConfig = {
  overnight: {
    label: 'Overnight stops',
    layer: markers,
    color: '#111827',
    visible: true
  }
};

if (routeSegments.length) {
  overlayConfig.route = {
    label: 'Driving route',
    layer: null,
    color: '#1f6feb',
    visible: true
  };
}

activityOrder.forEach((key) => {
  overlayConfig[key] = {
    label: activityLabels[key] || key,
    layer: activityLayers[key],
    color: activityColors[key] || '#6e7781',
    visible: false
  };
});

const isActivityVisible = (markerId) => {
  const markerEntry = activityMarkerLookup[markerId];
  if (!markerEntry) {
    return false;
  }
  const group = activityLayers[markerEntry.groupKey];
  return group ? group.hasLayer(markerEntry.layer) : false;
};

const isOvernightVisible = (night) => {
  const layer = overnightMarkersByNight[night];
  return layer ? markers.hasLayer(layer) : false;
};

const pulseLayer = (layer) => {
  if (!layer) {
    return;
  }
  const element = layer.getElement && layer.getElement();
  if (!element) {
    return;
  }
  element.classList.remove('marker-pulse');
  void element.offsetWidth;
  element.classList.add('marker-pulse');
};

const setGroupVisibility = (key, visible) => {
  const config = overlayConfig[key];
  if (!config) {
    return;
  }
  config.visible = visible;
  if (key === 'route') {
    Object.values(routeLegLayers).forEach((layer) => {
      if (visible) {
        map.addLayer(layer);
      } else {
        map.removeLayer(layer);
      }
    });
    return;
  }
  if (key === 'overnight') {
    Object.keys(overnightMarkersByNight).forEach((night) => {
      setOvernightVisibility(Number(night), visible);
    });
    return;
  }
  const markerIds = activityMarkersByGroup[key] || [];
  markerIds.forEach((markerId) => setActivityVisibility(markerId, visible));
};

const setActivityVisibility = (markerId, visible) => {
  const markerEntry = activityMarkerLookup[markerId];
  if (!markerEntry) {
    return;
  }
  const group = activityLayers[markerEntry.groupKey];
  if (visible) {
    if (group && !group.hasLayer(markerEntry.layer)) {
      group.addLayer(markerEntry.layer);
    }
  } else if (group && group.hasLayer(markerEntry.layer)) {
    group.removeLayer(markerEntry.layer);
  }
};

const setOvernightVisibility = (night, visible) => {
  const layer = overnightMarkersByNight[night];
  if (!layer) {
    return;
  }
  if (visible) {
    if (!markers.hasLayer(layer)) {
      markers.addLayer(layer);
    }
  } else if (markers.hasLayer(layer)) {
    markers.removeLayer(layer);
  }
};

Object.values(activityLayers).forEach((layer) => {
  map.addLayer(layer);
});

Object.entries(overlayConfig).forEach(([key, config]) => {
  setGroupVisibility(key, config.visible);
});

restoreOverlayState(savedMapState);

let legendContainer = null;

const updateMapView = () => {
  if (hasSavedView) return;
  const bounds = markers.getBounds();
  Object.values(routeLegLayers).forEach((layer) => {
    if (map.hasLayer(layer)) {
      bounds.extend(layer.getBounds());
    }
  });
  const legendWidth =
    legendContainer && !legendContainer.classList.contains('collapsed')
      ? Math.min(legendContainer.getBoundingClientRect().width, 320)
      : 0;
  map.fitBounds(bounds.pad(0.2), {
    paddingTopLeft: [30, 30],
    paddingBottomRight: [legendWidth + 30, 30]
  });
};

const legend = L.control({ position: 'topright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  const activityNames = activityMarkers.reduce((acc, marker) => {
    if (!acc[marker.type]) {
      acc[marker.type] = [];
    }
    acc[marker.type].push(marker.name);
    return acc;
  }, {});

  const sortedStops = geojson.features
    .slice()
    .sort((a, b) => a.properties.night - b.properties.night);

  const items = sortedStops
    .map((feature, index) => {
      const checked = isOvernightVisible(feature.properties.night) ? 'checked' : '';
      return `
        <li class='legend-item legend-item-toggle'>
          <label class='legend-toggle-item'>
            <input class='legend-checkbox' type='checkbox' data-overnight='${feature.properties.night}' ${checked} />
            <span>${feature.properties.night}. ${feature.properties.title}</span>
          </label>
        </li>`;
    })
    .join('');

  const overlayOrder = ['overnight', ...(routeSegments.length ? ['route'] : []), ...activityOrder];

  const activitySections = overlayOrder
    .filter(
      (key) =>
        key === 'overnight' ||
        key === 'route' ||
        (activityMarkersByGroup[key] && activityMarkersByGroup[key].length)
    )
    .map((key) => {
      const config = overlayConfig[key];
      const checked = config && config.visible ? 'checked' : '';
      const colorDot = config && config.color
        ? `<span class='layer-color' style='background:${config.color}'></span>`
        : '';
      const label = config ? config.label : activityLabels[key] || key;
      const listItems = key === 'overnight'
        ? `
          <div class='legend-subheading'>Stops</div>
          <ul class='legend-list'>${items}</ul>`
        : key === 'route'
          ? `<ul class='legend-list'>${routeSegments
              .map((segment) => {
                const checked = map.hasLayer(routeLegLayers[segment.id]) ? 'checked' : '';
                const note = segment.note ? ` (${segment.note})` : '';
                return `
                  <li class='legend-item legend-item-toggle'>
                    <label class='legend-toggle-item'>
                      <input class='legend-checkbox' type='checkbox' data-route='${segment.id}' ${checked} />
                      <span>${segment.from_night}. ${segment.from} → ${segment.to_night}. ${segment.to} (${segment.km} km)${note}</span>
                    </label>
                  </li>`;
              })
              .join('')}</ul>`
          : `<ul class='legend-list'>${(activityMarkersByGroup[key] || [])
              .map((markerId) => {
                const marker = activityMarkerData[markerId];
                const isChecked = isActivityVisible(markerId) ? 'checked' : '';
                return `
                  <li class='legend-item legend-item-toggle'>
                    <label class='legend-toggle-item'>
                      <input class='legend-checkbox' type='checkbox' data-marker='${markerId}' ${isChecked} />
                      <span>${marker.name}${marker.distance ? ` · ${marker.distance} · ${marker.time}` : ''}</span>
                    </label>
                  </li>`;
              })
              .join('')}</ul>`;
      return `
        <div class='legend-section collapsed' data-section='${key}'>
          <div class='legend-section-header'>
            <button class='legend-section-toggle' type='button' data-section-toggle='${key}'>
              <span class='legend-triangle'></span>
            </button>
            <label class='legend-toggle-item'>
              <input class='legend-checkbox' type='checkbox' data-layer='${key}' ${checked} />
              ${colorDot}
              <span class='legend-section-title' data-section-toggle='${key}'>${label}</span>
            </label>
          </div>
          <div class='legend-section-body'>
            ${listItems}
          </div>
        </div>`;
    })
    .join('');

  div.innerHTML = `
    <div class='legend-header'>
      <div class='legend-heading' id='legend-heading'>Map layers</div>
      <button class='legend-menu-toggle' type='button' aria-controls='legend-body' aria-expanded='false' aria-label='Show map layers'>
        <svg width='24' height='24' viewBox='0 0 24 24' aria-hidden='true'>
          <path d='M4 7h16M4 12h16M4 17h16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'/>
        </svg>
      </button>
    </div>
    <div class='legend-body' id='legend-body' aria-labelledby='legend-heading'>
      <div class='map-tools'>
        <input class='map-tool-input' id='map-search' type='search' placeholder='Search places, stops, routes…' aria-label='Search map places' autocomplete='off' />
        <div class='map-search-results' id='map-search-results' role='listbox'></div>
        <select class='map-tool-select' id='day-focus' aria-label='Focus on a trip day'>
          <option value=''>Full trip · all days</option>
          ${sortedStops.map((feature) => `<option value='${feature.properties.night}'>Day ${feature.properties.night} · ${feature.properties.title}</option>`).join('')}
        </select>
        <label class='map-tool-check'><input id='deanna-filter' type='checkbox' /> ★ Deanna’s must-dos only</label>
        <label class='map-tool-check'><input id='access-connectors' type='checkbox' checked /> Show approximate access spurs</label>
        <div class='route-key'>
          <span class='route-key-swatch' style='background:#1f6feb'></span>main route
          <span class='route-key-swatch' style='background:#f97316'></span>F-road
          <span class='route-key-swatch' style='background:#7c3aed;border-top:2px dashed white'></span>access
        </div>
      </div>
      <div class='popup-font-control'>
        <div class='popup-font-control-row'>
          <label for='popup-font-size'>Popup text</label>
          <input
            id='popup-font-size'
            type='range'
            min='${MIN_POPUP_FONT_SIZE}'
            max='${MAX_POPUP_FONT_SIZE}'
            step='1'
            value='${popupFontSize}'
            aria-describedby='popup-font-value'
          />
          <output class='popup-font-value' id='popup-font-value' for='popup-font-size'>${popupFontSize}px</output>
        </div>
      </div>
      <div class='offline-save-control'>
        <label class='offline-save-label' for='offline-map-enabled'>
          <input id='offline-map-enabled' type='checkbox' />
          <span>Make overview available offline</span>
        </label>
        <div class='offline-save-status' id='offline-map-status' aria-live='polite'>Checking…</div>
      </div>
      <label class='legend-toggle-item'>
        <input class='legend-checkbox' type='checkbox' data-layer='all' />
        <span class='legend-section-title' data-section-toggle='all'>All overlays</span>
      </label>
      ${activitySections}
    </div>
  `;
  const popupFontInput = div.querySelector('#popup-font-size');
  const popupFontValue = div.querySelector('#popup-font-value');
  popupFontInput.addEventListener('input', () => {
    applyPopupFontSize(popupFontInput.value);
    popupFontInput.value = String(popupFontSize);
    popupFontValue.value = `${popupFontSize}px`;
    popupFontValue.textContent = `${popupFontSize}px`;
    if (hasFinishedInitialLoad) persistCurrentState();
  });

  const offlineCheckbox = div.querySelector('#offline-map-enabled');
  const offlineStatus = div.querySelector('#offline-map-status');
  const sendOfflineMessage = async (type) => {
    if (!('serviceWorker' in navigator)) {
      throw new Error('Service workers unavailable');
    }
    const registration = await navigator.serviceWorker.ready;
    const worker = navigator.serviceWorker.controller || registration.active;
    if (!worker) {
      throw new Error('Offline worker unavailable');
    }
    return new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const timeout = window.setTimeout(() => reject(new Error('Offline request timed out')), 15000);
      channel.port1.onmessage = (event) => {
        window.clearTimeout(timeout);
        resolve(event.data);
      };
      worker.postMessage({ type }, [channel.port2]);
    });
  };
  const setOfflineControlState = (enabled, message) => {
    offlineCheckbox.checked = enabled;
    offlineStatus.textContent = message;
  };
  const initializeOfflineControl = async () => {
    try {
      const result = await sendOfflineMessage('GET_OFFLINE_STATUS');
      setOfflineControlState(Boolean(result.enabled), result.enabled ? 'Available offline' : 'Not saved');
    } catch (error) {
      offlineCheckbox.disabled = true;
      offlineStatus.textContent = 'Offline saving unavailable';
    }
  };
  offlineCheckbox.addEventListener('change', async () => {
    const shouldEnable = offlineCheckbox.checked;
    offlineCheckbox.disabled = true;
    offlineStatus.textContent = shouldEnable ? 'Saving overview…' : 'Removing saved map…';
    try {
      const result = await sendOfflineMessage(shouldEnable ? 'SAVE_OFFLINE' : 'REMOVE_OFFLINE');
      const enabled = Boolean(result.enabled);
      setOfflineControlState(enabled, enabled ? 'Available offline' : shouldEnable ? 'Could not save offline' : 'Not saved');
    } catch (error) {
      setOfflineControlState(!shouldEnable, 'Offline setting could not be changed');
    } finally {
      offlineCheckbox.disabled = false;
    }
  });
  initializeOfflineControl();
  navigator.serviceWorker?.addEventListener('controllerchange', () => {
    offlineCheckbox.disabled = false;
    offlineStatus.textContent = 'Checking…';
    initializeOfflineControl();
  });

  const searchInput = div.querySelector('#map-search');
  const searchResults = div.querySelector('#map-search-results');
  const dayFocus = div.querySelector('#day-focus');
  const deannaFilter = div.querySelector('#deanna-filter');
  const connectorToggle = div.querySelector('#access-connectors');
  let daySnapshot = null;
  let deannaSnapshot = null;

  const searchEntries = [
    ...Object.entries(activityMarkerData).map(([id, marker]) => ({
      type: 'activity', id, label: marker.name, detail: marker.favorite ? '★ Deanna’s recommendation' : (activityLabels[marker.type] || marker.type)
    })),
    ...geojson.features.map((feature) => ({
      type: 'overnight', id: feature.properties.night,
      label: `${feature.properties.night}. ${feature.properties.title}`, detail: 'Overnight stop'
    })),
    ...routeSegments.map((segment) => ({
      type: 'route', id: segment.id, label: `${segment.from} → ${segment.to}`, detail: `${segment.km} km drive`
    }))
  ];
  const clearSearchResults = () => {
    searchResults.replaceChildren();
    searchResults.classList.remove('has-results');
  };
  searchInput.addEventListener('input', () => {
    clearSearchResults();
    const query = searchInput.value.trim().toLocaleLowerCase();
    if (query.length < 2) return;
    searchEntries.filter((entry) => `${entry.label} ${entry.detail}`.toLocaleLowerCase().includes(query)).slice(0, 8).forEach((entry) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'map-search-result';
      button.textContent = `${entry.label} · ${entry.detail}`;
      button.addEventListener('click', () => {
        if (entry.type === 'activity') {
          const markerEntry = activityMarkerLookup[entry.id];
          setActivityVisibility(entry.id, true);
          map.setView(markerEntry.layer.getLatLng(), Math.max(10, map.getZoom()));
          markerEntry.layer.openPopup();
        } else if (entry.type === 'overnight') {
          const layer = overnightMarkersByNight[entry.id];
          setOvernightVisibility(Number(entry.id), true);
          map.setView(layer.getLatLng(), Math.max(9, map.getZoom()));
          layer.openPopup();
        } else {
          const layer = routeLegLayers[entry.id];
          map.addLayer(layer);
          map.fitBounds(layer.getBounds(), { padding: [35, 35] });
          layer.openPopup();
        }
        searchInput.value = entry.label;
        clearSearchResults();
        refreshCheckboxes();
      });
      searchResults.appendChild(button);
    });
    searchResults.classList.toggle('has-results', searchResults.childElementCount > 0);
  });
  searchInput.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      searchInput.value = '';
      clearSearchResults();
    }
  });

  connectorToggle.addEventListener('change', () => {
    if (connectorToggle.checked) map.addLayer(accessConnectors);
    else map.removeLayer(accessConnectors);
  });

  dayFocus.addEventListener('change', () => {
    const selectedNight = Number(dayFocus.value);
    if (!dayFocus.value) {
      if (daySnapshot) {
        Object.entries(daySnapshot.activities).forEach(([id, visible]) => setActivityVisibility(id, visible));
        Object.entries(daySnapshot.overnights).forEach(([night, visible]) => setOvernightVisibility(Number(night), visible));
        Object.entries(daySnapshot.routes).forEach(([id, visible]) => {
          const layer = routeLegLayers[id];
          if (visible) map.addLayer(layer); else map.removeLayer(layer);
        });
      }
      daySnapshot = null;
      refreshCheckboxes();
      return;
    }
    if (!daySnapshot) {
      daySnapshot = {
        activities: Object.fromEntries(Object.keys(activityMarkerData).map((id) => [id, isActivityVisible(id)])),
        overnights: Object.fromEntries(Object.keys(overnightMarkersByNight).map((night) => [night, isOvernightVisible(Number(night))])),
        routes: Object.fromEntries(Object.entries(routeLegLayers).map(([id, layer]) => [id, map.hasLayer(layer)]))
      };
    }
    Object.entries(activityMarkerData).forEach(([id, marker]) => setActivityVisibility(id, Number(marker.night) === selectedNight));
    Object.keys(overnightMarkersByNight).forEach((night) => setOvernightVisibility(Number(night), Number(night) === selectedNight || Number(night) === selectedNight - 1));
    Object.entries(routeLegLayers).forEach(([id, layer]) => {
      const segment = routeSegments.find((item) => item.id === id);
      if (segment && Number(segment.to_night) === selectedNight) map.addLayer(layer); else map.removeLayer(layer);
    });
    const selectedLayers = [
      overnightMarkersByNight[selectedNight],
      ...Object.entries(activityMarkerData).filter(([, marker]) => Number(marker.night) === selectedNight).map(([id]) => activityMarkerLookup[id].layer),
      ...Object.entries(routeLegLayers).filter(([id]) => Number(routeSegments.find((item) => item.id === id)?.to_night) === selectedNight).map(([, layer]) => layer)
    ].filter(Boolean);
    const bounds = L.featureGroup(selectedLayers).getBounds();
    if (bounds.isValid()) map.fitBounds(bounds.pad(0.15), { padding: [30, 30] });
    refreshCheckboxes();
  });

  deannaFilter.addEventListener('change', () => {
    if (deannaFilter.checked) {
      deannaSnapshot = Object.fromEntries(Object.keys(activityMarkerData).map((id) => [id, isActivityVisible(id)]));
      Object.entries(activityMarkerData).forEach(([id, marker]) => setActivityVisibility(id, Boolean(marker.favorite)));
    } else if (deannaSnapshot) {
      Object.entries(deannaSnapshot).forEach(([id, visible]) => setActivityVisibility(id, visible));
      deannaSnapshot = null;
    }
    refreshCheckboxes();
  });

  const mobileLegendQuery = window.matchMedia('(max-width: 700px)');
  const menuToggle = div.querySelector('.legend-menu-toggle');
  const setLegendCollapsed = (collapsed) => {
    div.classList.toggle('collapsed', collapsed);
    menuToggle.setAttribute('aria-expanded', String(!collapsed));
    menuToggle.setAttribute('aria-label', collapsed ? 'Show map layers' : 'Hide map layers');
  };
  setLegendCollapsed(mobileLegendQuery.matches);
  menuToggle.addEventListener('click', () => {
    setLegendCollapsed(!div.classList.contains('collapsed'));
    updateMapView();
  });
  const handleViewportChange = (event) => setLegendCollapsed(event.matches);
  if (mobileLegendQuery.addEventListener) {
    mobileLegendQuery.addEventListener('change', handleViewportChange);
  } else {
    mobileLegendQuery.addListener(handleViewportChange);
  }
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  const getGroupState = (key) => {
    if (key === 'route') {
      const total = Object.keys(routeLegLayers).length;
      const visibleCount = Object.values(routeLegLayers).filter((layer) => map.hasLayer(layer)).length;
      return {
        total,
        checked: total > 0 && visibleCount === total,
        indeterminate: visibleCount > 0 && visibleCount < total
      };
    }
    if (key === 'overnight') {
      const nights = Object.keys(overnightMarkersByNight);
      const visibleCount = nights.filter((night) => isOvernightVisible(Number(night))).length;
      return {
        total: nights.length,
        checked: nights.length > 0 && visibleCount === nights.length,
        indeterminate: visibleCount > 0 && visibleCount < nights.length
      };
    }
    const markerIds = activityMarkersByGroup[key] || [];
    const visibleCount = markerIds.filter((markerId) => isActivityVisible(markerId)).length;
    return {
      total: markerIds.length,
      checked: markerIds.length > 0 && visibleCount === markerIds.length,
      indeterminate: visibleCount > 0 && visibleCount < markerIds.length
    };
  };

  const updateAllCheckbox = () => {
    const allToggle = div.querySelector("input[data-layer='all']");
    const states = overlayOrder
      .map((key) => getGroupState(key))
      .filter((state) => state.total > 0);
    const allOn = states.length && states.every((state) => state.checked);
    const anyOn = states.some((state) => state.checked || state.indeterminate);
    allToggle.checked = allOn;
    allToggle.indeterminate = !allOn && anyOn;
  };
  const updateGroupCheckbox = (key) => {
    const checkbox = div.querySelector(`input[data-layer='${key}']`);
    if (!checkbox) {
      return;
    }
    const state = getGroupState(key);
    checkbox.checked = state.checked;
    checkbox.indeterminate = state.indeterminate;
  };

  const getGroupCheckboxes = () =>
    overlayOrder
      .map((key) => div.querySelector(`input[data-layer='${key}']`))
      .filter(Boolean);

  const getItemCheckboxes = () =>
    div.querySelectorAll("input[data-marker], input[data-overnight], input[data-route]");

  const updateItemCheckboxes = (groupKey = null) => {
    if (groupKey === 'overnight' || !groupKey) {
      Object.keys(overnightMarkersByNight).forEach((night) => {
        const checkbox = div.querySelector(`input[data-overnight='${night}']`);
        if (checkbox) {
          checkbox.checked = isOvernightVisible(Number(night));
        }
      });
    }
    if (groupKey === 'route' || !groupKey) {
      Object.entries(routeLegLayers).forEach(([legId, layer]) => {
        const checkbox = div.querySelector(`input[data-route='${legId}']`);
        if (checkbox) {
          checkbox.checked = map.hasLayer(layer);
        }
      });
    }
    activityOrder.forEach((key) => {
      if (groupKey && groupKey !== key) {
        return;
      }
      (activityMarkersByGroup[key] || []).forEach((markerId) => {
        const checkbox = div.querySelector(`input[data-marker='${markerId}']`);
        if (checkbox) {
          checkbox.checked = isActivityVisible(markerId);
        }
      });
    });
  };

  const refreshCheckboxes = () => {
    overlayOrder.forEach((key) => updateGroupCheckbox(key));
    updateItemCheckboxes();
    updateAllCheckbox();
  };

  refreshCheckboxes();
  div.querySelectorAll('.legend-checkbox').forEach((input) => {
    const key = input.getAttribute('data-layer');
    if (!key) {
      return;
    }
    if (key === 'all') {
      input.addEventListener('change', () => {
        const visible = input.checked;
        overlayOrder.forEach((overlayKey) => {
          setGroupVisibility(overlayKey, visible);
        });
        refreshCheckboxes();
        if (hasFinishedInitialLoad) persistCurrentState();
      });
      return;
    }
    input.addEventListener('change', () => {
      setGroupVisibility(key, input.checked);
      updateGroupCheckbox(key);
      updateItemCheckboxes(key);
      updateAllCheckbox();
      if (hasFinishedInitialLoad) persistCurrentState();
    });
  });
  getItemCheckboxes().forEach((input) => {
    const markerId = input.getAttribute('data-marker');
    const night = input.getAttribute('data-overnight');
    const routeId = input.getAttribute('data-route');
    const label = input.closest('label');
    if (label) {
      label.addEventListener('mouseenter', () => {
        if (markerId) {
          const markerEntry = activityMarkerLookup[markerId];
          if (markerEntry) {
            pulseLayer(markerEntry.layer);
          }
        }
        if (night) {
          pulseLayer(overnightMarkersByNight[Number(night)]);
        }
      });
      label.addEventListener('focus', () => {
        if (markerId) {
          const markerEntry = activityMarkerLookup[markerId];
          if (markerEntry) {
            pulseLayer(markerEntry.layer);
          }
        }
        if (night) {
          pulseLayer(overnightMarkersByNight[Number(night)]);
        }
      }, true);
    }
    input.addEventListener('change', () => {
      if (markerId) {
        setActivityVisibility(markerId, input.checked);
        const groupKey = activityMarkerLookup[markerId]?.groupKey;
        if (groupKey) {
          overlayConfig[groupKey].visible = getGroupState(groupKey).checked;
          updateGroupCheckbox(groupKey);
        }
      }
      if (night) {
        setOvernightVisibility(Number(night), input.checked);
        overlayConfig.overnight.visible = getGroupState('overnight').checked;
        updateGroupCheckbox('overnight');
      }
      if (routeId) {
        const layer = routeLegLayers[routeId];
        if (layer) {
          if (input.checked) {
            map.addLayer(layer);
          } else {
            map.removeLayer(layer);
          }
        }
        overlayConfig.route.visible = getGroupState('route').checked;
        updateGroupCheckbox('route');
      }
      updateAllCheckbox();
      if (hasFinishedInitialLoad) persistCurrentState();
    });
  });
  div.querySelectorAll('[data-section-toggle]').forEach((toggle) => {
    const key = toggle.getAttribute('data-section-toggle');
    if (key === 'all') {
      return;
    }
    toggle.addEventListener('click', () => {
      const section = div.querySelector(`.legend-section[data-section='${key}']`);
      if (!section) {
        return;
      }
      section.classList.toggle('collapsed');
      updateMapView();
      if (hasFinishedInitialLoad) persistCurrentState();
    });
  });
  legendContainer = div;
  restoreLegendState(savedMapState);
  return div;
};
legend.addTo(map);

const connectivityControl = L.control({ position: 'bottomleft' });
connectivityControl.onAdd = () => {
  const status = L.DomUtil.create('div', 'connectivity-status');
  const update = () => {
    status.textContent = navigator.onLine ? 'Online' : 'Offline · using saved map';
  };
  window.addEventListener('online', update);
  window.addEventListener('offline', update);
  update();
  return status;
};
connectivityControl.addTo(map);

// Offline support is opt-in from the checkbox; the worker saves the app shell and overview tiles.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
}

updateMapView();
hasFinishedInitialLoad = true;
</script>
</body>
</html>
