<html>

<meta charset="utf-8"/>
<title>Iceland Trip Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<style>
  :root {
    /* Change this one value to resize text in every map popup. */
    --map-popup-font-size: 16px;
  }
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; }
  .leaflet-popup-content {
    font-size: var(--map-popup-font-size);
    line-height: 1.35;
  }
  .popup-title { font-weight: 600; }
  .popup-font-control {
    border-bottom: 1px solid rgba(17, 24, 39, 0.14);
    margin-bottom: 8px;
    padding-bottom: 10px;
  }
  .popup-font-control-row {
    align-items: center;
    display: flex;
    gap: 10px;
  }
  .popup-font-control label {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .popup-font-control input[type='range'] {
    accent-color: #1f6feb;
    flex: 1;
    min-width: 110px;
  }
  .popup-font-value {
    font-size: 13px;
    min-width: 36px;
    text-align: right;
  }
  .map-search {
    border-bottom: 1px solid rgba(17, 24, 39, 0.14);
    margin-bottom: 10px;
    padding-bottom: 10px;
    position: relative;
  }
  .map-search-input-wrap {
    align-items: center;
    display: flex;
    position: relative;
  }
  .map-search-icon {
    color: #6b7280;
    left: 9px;
    pointer-events: none;
    position: absolute;
  }
  .map-search-input {
    border: 1px solid #9ca3af;
    border-radius: 7px;
    box-sizing: border-box;
    font-size: 15px;
    padding: 9px 34px 9px 31px;
    width: 100%;
  }
  .map-search-input:focus {
    border-color: #1f6feb;
    box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.18);
    outline: none;
  }
  .map-search-clear {
    background: transparent;
    border: 0;
    border-radius: 4px;
    color: #4b5563;
    cursor: pointer;
    display: none;
    font-size: 20px;
    height: 28px;
    line-height: 1;
    padding: 0;
    position: absolute;
    right: 4px;
    width: 28px;
  }
  .map-search.has-value .map-search-clear {
    display: block;
  }
  .map-search-results {
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    display: none;
    left: 0;
    list-style: none;
    margin: 4px 0 0;
    max-height: min(300px, 45vh);
    overflow-y: auto;
    padding: 4px;
    position: absolute;
    right: 0;
    top: 100%;
    z-index: 1000;
  }
  .map-search-results.visible {
    display: block;
  }
  .map-search-result,
  .map-search-empty {
    border-radius: 5px;
    box-sizing: border-box;
    display: block;
    padding: 8px 9px;
    width: 100%;
  }
  .map-search-result {
    background: transparent;
    border: 0;
    color: #111827;
    cursor: pointer;
    text-align: left;
  }
  .map-search-result:hover,
  .map-search-result:focus,
  .map-search-result.active {
    background: #eaf2ff;
    outline: none;
  }
  .map-search-result-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
  }
  .map-search-result-meta,
  .map-search-empty {
    color: #6b7280;
    font-size: 12px;
  }
  .legend {
    background: rgba(255, 255, 255, 0.94);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    padding: 10px 12px;
    max-width: 320px;
  }
  .legend.collapsed .legend-body {
    display: none;
  }
  .legend-menu-toggle {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 6px;
    color: #111827;
    cursor: pointer;
    display: none;
    height: 40px;
    justify-content: center;
    padding: 0;
    width: 40px;
  }
  .legend-menu-toggle:focus-visible {
    outline: 3px solid rgba(31, 111, 235, 0.45);
    outline-offset: 1px;
  }
  .legend-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .legend-heading {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .legend-item {
    display: flex;
    gap: 8px;
    font-size: 13px;
    line-height: 1.4;
  }
  .legend-section {
    margin-top: 10px;
  }
  .legend-section.collapsed .legend-section-body {
    display: none;
  }
  .legend-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend-section-toggle {
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
  }
  .legend-triangle {
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 8px solid #111827;
    transition: transform 0.15s ease;
  }
  .legend-section:not(.collapsed) .legend-triangle {
    transform: rotate(90deg);
  }
  .legend-toggle-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .legend-section-title {
    cursor: pointer;
    font-weight: 600;
  }
  .legend-subheading {
    font-weight: 600;
    margin: 6px 0 4px;
  }
  .legend-checkbox {
    accent-color: #1f6feb;
  }
  .legend-list {
    list-style: none;
    margin: 0 0 6px 16px;
    padding: 0;
  }
  .legend-list li {
    margin-bottom: 2px;
  }
  .legend-item-toggle {
    align-items: flex-start;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .legend-night {
    font-weight: 600;
    min-width: 18px;
    text-align: right;
  }
  .marker-label {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
  }
  .favorite-marker {
    color: #f5c542;
    font-size: 18px;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  .marker-pulse {
    animation: marker-pulse 0.8s ease-in-out 2;
    transform-origin: center;
  }
  @keyframes marker-pulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.35);
      opacity: 0.6;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }
  .activity-group {
    margin-top: 6px;
  }
  .activity-title {
    font-weight: 700;
    margin-bottom: 2px;
  }
  .activity-group ul {
    margin: 0;
    padding-left: 16px;
  }
  .trail-summary {
    color: #374151;
    line-height: 1.4;
    margin: 7px 0;
    max-width: 280px;
  }
  .trail-stats {
    display: grid;
    gap: 3px 10px;
    grid-template-columns: max-content 1fr;
    margin: 8px 0;
  }
  .trail-stats dt {
    color: #4b5563;
    font-weight: 600;
  }
  .trail-stats dd {
    margin: 0;
  }
  .trail-note {
    background: #f3f4f6;
    border-radius: 6px;
    line-height: 1.4;
    margin-top: 8px;
    padding: 7px 8px;
  }
  .trail-link {
    background: #2da44e;
    border-radius: 6px;
    color: #fff !important;
    display: inline-block;
    font-weight: 600;
    margin-top: 9px;
    padding: 7px 10px;
    text-decoration: none;
  }
  .trail-link:hover,
  .trail-link:focus {
    background: #238636;
  }

    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    vertical-align: middle;

    }
    .legend-heading {
      margin-bottom: 0;
    }
    .legend-body {
      padding: 4px 12px 12px;
    }
    .legend-menu-toggle {
      display: inline-flex;
      flex: 0 0 auto;
    }
    .legend.collapsed {
      height: 44px;
      overflow: hidden;
      width: 44px;
    }
    .legend.collapsed .legend-header {
      height: 44px;
      justify-content: center;
      padding: 0;
    }
    .legend.collapsed .legend-heading {
      display: none;
    }
  }
</style>
