    padding: 0;

    width: 0;

    border-bottom: 5px solid transparent;

  }

    transform: rotate(90deg);
  }
  .legend-toggle-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .legend-section-title {
    cursor: pointer;
    font-weight: 600;
  }
  .legend-subheading {
    font-weight: 600;
    margin: 6px 0 4px;
  }
  .legend-checkbox {
    accent-color: #1f6feb;
  }

    margin: 0 0 6px 16px;
    padding: 0;
  }
  .legend-list li {
    margin-bottom: 2px;
  }
  .legend-item-toggle {
    align-items: flex-start;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .legend-night {
    font-weight: 600;
    min-width: 18px;
    text-align: right;
  }
  .marker-label {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;

    font-size: 18px;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }

    animation: marker-pulse 0.8s ease-in-out 2;
    transform-origin: center;
  }

    0% {

      opacity: 1;
    }

      opacity: 1;

      margin-bottom: 0;
    }

      justify-content: center;
      padding: 0;
